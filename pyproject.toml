[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "github-code-rag"
version = "0.1.0"
description = "MCP Server for GitHub repository search"
authors = [
    {name = "suyu-creator"},
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
github-code-rag = "server.mcp_server:main"

[tool.setuptools.packages.find]
include = ["core*", "server*", "github*"]

[tool.pytest.ini_options]
testpaths = ["tests"]